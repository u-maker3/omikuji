let count=0,current=null;
const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)];

 const msgs=["神さまに接続しています…","神さま、まだ寝てる可能性があります。","少々お待ちください。","既読は付きました。","なんとか捕まりました。"];

 else if(rareRoll<.016)special={rank:"神、既読無視。",oracle:"見てはいます。返事するとは言うてません。",sad:true};
 else if(rareRoll<.024)special={rank:"神、回答拒否。",oracle:"それ聞いてどうすんねん。",sad:true};
 else if(rareRoll<.032)special={rank:"神、逆質問。",oracle:"で、あんたはどうしたいん。",sad:false};
 else if(rareRoll<.040)special={rank:"神、呆れる。",oracle:"昨日も同じことで悩んでへん？",sad:true};
 else if(rareRoll<.045)special={rank:"神、降臨。",oracle:"来たけど、特にない。",sad:false};
 else if(rareRoll<.050)special={rank:"🌈 超・知らんけど大吉 🌈",oracle:"今日は何しても知らん。せやけど、なんかいけそう。根拠：ない。",sad:false};

 current={
   rank:special?.rank||pick(ranks),overall:pick(pools.overall),work:pick(pools.work),

 show("result");
 $("rank").textContent=current.rank;

 const data=[["総合運",current.overall],["仕事",current.work],["金",current.money],["恋愛",current.love],["人間関係",current.people],["今日やること",current.doit],["今日やめとくこと",current.stop]];
 $("rows").innerHTML=data.map(x=>`<div class="row"><div class="label">${x[0]}</div><div class="text">${x[1]}</div></div>`).join("");

/* ===== 保存画像：iPhone Safari対策版 =====
   SVG foreignObject は使わず、Canvasへ直接描画する。
*/
function roundRect(ctx,x,y,w,h,r,fill,stroke,lineWidth=1){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.lineWidth=lineWidth;ctx.strokeStyle=stroke;ctx.stroke();}
}

function splitLines(ctx,text,maxWidth){
  const lines=[];
  let line="";
  for(const ch of String(text??"")){
    const test=line+ch;
    if(line && ctx.measureText(test).width>maxWidth){
      lines.push(line);
      line=ch;
    }else{
      line=test;
    }
  }
  if(line)lines.push(line);
  return lines.length?lines:[""];
}

function drawWrapped(ctx,text,x,y,maxWidth,lineHeight){
  const lines=splitLines(ctx,text,maxWidth);
  lines.forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight));
  return y+lines.length*lineHeight;
}

function dashedLine(ctx,x1,y,x2){
  ctx.save();
  ctx.beginPath();
  ctx.setLineDash([10,10]);
  ctx.strokeStyle="#d8c9a7";
  ctx.lineWidth=2;
  ctx.moveTo(x1,y);
  ctx.lineTo(x2,y);
  ctx.stroke();
  ctx.restore();
}

function measureRow(ctx,label,text,textWidth){
  ctx.font='650 32px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  const lines=splitLines(ctx,text,textWidth);
  return Math.max(88,lines.length*48+30);
}

function loadCanvasImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}

async function saveCard(){
  try{
    if(!current){ alert("先におみくじ引いてな🤣"); return; }

    const canvas=$("shareCanvas");
    const ctx=canvas.getContext("2d");
    if(!ctx){ alert("画像を作る準備ができやんかった😭"); return; }

    const W=1080, pad=64, innerX=pad, innerW=W-pad*2;
    const labelW=170, gap=22;
    const textX=innerX+34+labelW+gap;
    const textWidth=innerX+innerW-34-textX;

    const items=[
      ["総合運",current.overall],["仕事",current.work],["金",current.money],
      ["恋愛",current.love],["人間関係",current.people],
      ["今日やる",current.doit],["今日やめる",current.stop]
    ];

    // うめこ画像を先に読み込む
    let umeImg=null;
    try{
      umeImg=await loadCanvasImage(current.sad?"UMEKO_SAD.PNG":"UMEKO_OMIKUJI.PNG");
    }catch(e){
      console.warn("うめこ画像の読み込み失敗",e);
    }

    // 各ブロックの高さ計算
    ctx.font='650 32px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
    let rowsHeight=0;
    items.forEach(([a,b])=>rowsHeight+=measureRow(ctx,a,b,textWidth));

    ctx.font='800 36px Georgia,"Hiragino Mincho ProN","Yu Mincho",serif';
    const oracleLines=splitLines(ctx,"「"+current.oracle+"」",innerW-100);
    const oracleH=74+oracleLines.length*48+32;

    ctx.font='800 32px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
    const umekoLines=splitLines(ctx,'うめこ「'+current.umeko+'」',innerW-100);
    const umekoH=Math.max(98,umekoLines.length*44+42);

    const headerH=190;
    const heroTop=215;
    const heroH=390;
    const cardTop=650;
    const cardH=28+rowsHeight+oracleH+18+umekoH+32;
    const H=Math.max(1900,cardTop+cardH+120);

    canvas.width=W;
    canvas.height=H;

    // 背景
    ctx.fillStyle="#fff9eb";
    ctx.fillRect(0,0,W,H);

    // タイトル帯
    const g=ctx.createLinearGradient(0,0,W,headerH);
    g.addColorStop(0,"#7d1018");
    g.addColorStop(.5,"#a51e27");
    g.addColorStop(1,"#7d1018");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,headerH);

    // タイトル：鳥居絵文字を外して文字幅事故を防止
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillStyle="#fff";
    ctx.save();
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.font='900 48px Georgia,"Hiragino Mincho ProN","Yu Mincho",serif';
    ctx.fillText("神さん、今日どない？",W/2,72);
    ctx.restore();

    ctx.font='700 22px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
    ctx.fillStyle="rgba(255,255,255,.94)";
    ctx.fillText("― 聞いたことを後悔するおみくじ ―",W/2,132);

    // 小さい鳥居マーク
    ctx.font='700 34px serif';
    ctx.fillText("⛩",W/2,174);

    // うめこは空いている右側へ。タイトル・結果の中央揃えには影響させない。
    if(umeImg){
      const maxW=310, maxH=310;
      const scale=Math.min(maxW/umeImg.naturalWidth,maxH/umeImg.naturalHeight);
      const dw=umeImg.naturalWidth*scale, dh=umeImg.naturalHeight*scale;
      ctx.drawImage(umeImg,W-dw-55,heroTop-5,dw,dh);
    }

    // ランクは画像の有無に関係なく画像全体の中央
    ctx.textAlign="center";
    ctx.fillStyle="#8b1820";
    ctx.font='900 62px Georgia,"Hiragino Mincho ProN","Yu Mincho",serif';
    const rankLines=splitLines(ctx,current.rank,760);
    let rankY=430;
    rankLines.forEach(line=>{
      ctx.fillText(line,W/2,rankY);
      rankY+=62;
    });

    // 名前＋日付
    const date=new Intl.DateTimeFormat("ja-JP",{
      year:"numeric",month:"2-digit",day:"2-digit"
    }).format(current.date);
    ctx.fillStyle="#6b5845";
    ctx.font='700 30px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
    ctx.fillText((current.name?current.name+"さん　":"")+date,W/2,585);

    // 本文カード
    roundRect(ctx,innerX,cardTop,innerW,cardH,28,"rgba(255,255,255,.94)","#d7a52f",3);

    let y=cardTop+28;
    ctx.textAlign="left";
    ctx.textBaseline="alphabetic";

    for(const [label,text] of items){
      dashedLine(ctx,innerX+30,y,innerX+innerW-30);
      const rowH=measureRow(ctx,label,text,textWidth);

      ctx.fillStyle="#941d25";
      ctx.font='900 31px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
      ctx.fillText(label,innerX+34,y+50);

      ctx.fillStyle="#35271e";
      ctx.font='650 32px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
      drawWrapped(ctx,text,textX,y+48,textWidth,48);
      y+=rowH;
    }

    const oracleY=y+10;
    roundRect(ctx,innerX+28,oracleY,innerW-56,oracleH,20,"#f1dfb9",null);
    ctx.fillStyle="#35271e";
    ctx.font='800 34px Georgia,"Hiragino Mincho ProN","Yu Mincho",serif';
    ctx.fillText("神の捨て台詞",innerX+58,oracleY+48);
    ctx.font='800 36px Georgia,"Hiragino Mincho ProN","Yu Mincho",serif';
    drawWrapped(ctx,"「"+current.oracle+"」",innerX+58,oracleY+108,innerW-116,52);

    const umekoY=oracleY+oracleH+18;
    roundRect(ctx,innerX+28,umekoY,innerW-56,umekoH,18,"#fff","#e9c85d",3);
    ctx.fillStyle="#35271e";
    ctx.font='800 32px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
    drawWrapped(ctx,'うめこ「'+current.umeko+'」',innerX+58,umekoY+60,innerW-116,48);

    ctx.textAlign="center";
    ctx.fillStyle="#806d55";
    ctx.font='600 24px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
    ctx.fillText("本日の正式神託｜娯楽用のおみくじです",W/2,H-54);

    const png=canvas.toDataURL("image/png");
    if(!png || !png.startsWith("data:image/png")){
      alert("保存画像を作れやんかった😭"); return;
    }
    $("savedImage").src=png;
    $("saveModal").classList.remove("hidden");

  }catch(err){
    console.error("saveCard error",err);
    alert("保存処理でコケたわ😭");
  }
}
function closeSave(e){
  if(e && e.target!==$("saveModal")) return;
  $("saveModal").classList.add("hidden");
}

async function shareResult(){
 if(!current){alert("先におみくじ引いてな🤣");return;}
 const text=`⛩️ 神さん、今日どない？\n【${current.rank}】\n神「${current.oracle}」\nうめこ「${current.umeko}」`;
 if(navigator.share){
   try{await navigator.share({title:"神さん、今日どない？",text,url:location.href})}catch(e){}
 }else{
   try{
     await navigator.clipboard.writeText(text+"\n"+location.href);
     alert("結果をコピーしたで。友だちに食らわせてきて🤣");
   }catch(e){
     alert("共有できやんかった😭");
   }
 }
}
