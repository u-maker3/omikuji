<div id="umeko" class="umeko"></div>
<div id="retrial" class="retrial"></div>

<button class="ghost" onclick="shareResult()">友だちにも神託を食らわせる</button>
<button class="primary" onclick="startDraw()">もう一回、神を呼ぶ</button>

</div>
<canvas id="shareCanvas" width="1080" height="1350"></canvas>
</main>
<footer>娯楽用のおみくじです。人生の重要事項は神に丸投げせんと自分でも考えてな。</footer>

const umeko=["ほな、ぼちぼちいこか。","神さん言うてるけど、採用するかはあんた次第やで。","知らんけど、今日はこれでいこ🤣","神託より先に腹ごしらえちゃう？","それな。うめこも耳痛いわ。","はい、本日の神さんちょい辛口。","ええやん。1ミリで十分や。","神さん、急に現実的やな。","それ出来たら今日は花丸。","無理せん程度にやったれ。","今日は静かに勝ちにいこ。","神に言われんでも分かってたやろ🤣","ほな、余計なもん置いてこ。","大吉待ちせんと、自分でええ日にしよ。","なんか知らんけど、いけそうや。","今日はこれ以上こねくり回さん。","ちゃんと休むんも仕事やで。","神さんより自分の違和感も聞いとき。","全部せんでええ。一個でええ。","はい、神託終了。解散🤣","結果に文句ある人は再審どうぞ。","まあまあ、そんな日もある。","自分の機嫌は自分で回収しよ。","それ、明日のうめこにも言うといて。","運勢より行動ひとつ。これ強い。","神さん、今日ええこと言うやん。","ちょっと笑えたらもう半分勝ち。","知らんけどを付けたら大体やさしくなる。","今日も生きてる。それでまず一票。","ほな、行ってらっしゃい。気ぃつけてな。"];
const ranks=["超・知らんけど大吉","なんかイケる吉","欲出すな吉","今日は寝とけ吉","調子乗んな吉","黙っといた方が吉","神もよう分からん吉","一回帰ろか凶","先に片付けろ凶","今日は触んな凶"];
const retry=["","再審請求を受理しました。","まだ納得してへんのか。","神への圧が強い。","好きなん出るまで引く気やろ。","もう結果より執念が勝ってる。"];
let count=0,current=null;
const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)];
function show(id){["top","loading","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function startDraw(){
 count++; show("loading");
 const msgs=["神さまに接続しています…","神さま、まだ寝てる可能性があります。","少々お待ちください。","既読は付きました。","なんとか捕まりました。"];
 let i=0;$("status").textContent=msgs[0];
 const t=setInterval(()=>{i++; if(i<msgs.length)$("status").textContent=msgs[i];else{clearInterval(t);draw()}},520);
}
function draw(){
 const rareRoll=Math.random();
 let special=null;
 if(rareRoll<.008)special={rank:"神、留守。",oracle:"本日の営業は終了しました。自分の人生くらい自分で決めてください。",sad:true};
 else if(rareRoll<.016)special={rank:"神、既読無視。",oracle:"見てはいます。返事するとは言うてません。",sad:true};
 else if(rareRoll<.024)special={rank:"神、回答拒否。",oracle:"それ聞いてどうすんねん。",sad:true};
 else if(rareRoll<.032)special={rank:"神、逆質問。",oracle:"で、あんたはどうしたいん。",sad:false};
 else if(rareRoll<.040)special={rank:"神、呆れる。",oracle:"昨日も同じことで悩んでへん？",sad:true};
 else if(rareRoll<.045)special={rank:"神、降臨。",oracle:"来たけど、特にない。",sad:false};
 else if(rareRoll<.050)special={rank:"🌈 超・知らんけど大吉 🌈",oracle:"今日は何しても知らん。せやけど、なんかいけそう。根拠：ない。",sad:false};
 current={rank:special?.rank||pick(ranks),overall:pick(pools.overall),work:pick(pools.work),money:pick(pools.money),love:pick(pools.love),people:pick(pools.people),doit:pick(pools.doit),stop:pick(pools.stop),oracle:special?.oracle||pick(oracles),umeko:special?.rank==="神、降臨。"?"帰るんかい。":pick(umeko),sad:special?.sad||false,name:$("name").value.trim(),date:new Date()};
 render();
}
function render(){
 show("result"); $("rank").textContent=current.rank;
 $("who").textContent=current.name?current.name+"さんへの神託":"";
 $("resultChar").src=current.sad?"UMEKO_SAD.PNG":"UMEKO_OMIKUJI.PNG";
 const data=[["総合運",current.overall],["仕事",current.work],["金",current.money],["恋愛",current.love],["人間関係",current.people],["今日やること",current.doit],["今日やめとくこと",current.stop]];
 $("rows").innerHTML=data.map(x=>`<div class="row"><div class="label">${x[0]}</div><div class="text">${x[1]}</div></div>`).join("");
 $("oracle").innerHTML="⛩️ 神の捨て台詞<br>「"+current.oracle+"」";
 $("umeko").textContent="うめこ「"+current.umeko+"」";
 $("retrial").textContent=retry[Math.min(count-1,retry.length-1)];
}
function wrap(ctx,text,x,y,max,w=44,line=58){
 let s="",yy=y; for(const ch of text){if(ctx.measureText(s+ch).width>max){ctx.fillText(s,x,yy);s=ch;yy+=line}else s+=ch} if(s)ctx.fillText(s,x,yy);return yy+line;
}
function esc(s){
 return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function saveCard(){
 try{
   if(!current){ alert("先におみくじ引いてな🤣"); return; }

   const date=new Intl.DateTimeFormat("ja-JP").format(current.date);
   const items=[
     ["総合運",current.overall],["仕事",current.work],["金",current.money],
     ["恋愛",current.love],["人間関係",current.people],
     ["今日やる",current.doit],["今日やめる",current.stop]
   ];

   const rows=items.map(([a,b])=>`
     <div style="display:grid;grid-template-columns:170px 1fr;gap:18px;padding:16px 4px;border-top:1px dashed #d8c9a7;line-height:1.55;"><b style="color:#941d25;font-size:23px;">${esc(a)}</b><span style="font-size:25px;font-weight:650;">${esc(b)}</span></div>`).join("");

   const card=`
   <div xmlns="http://www.w3.org/1999/xhtml" style="
     width:1000px;min-height:1250px;padding:60px;box-sizing:border-box;
     background:linear-gradient(#8d151e 0 150px,#fff0c7 150px,#fffaf0 420px);
     font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;
     color:#35271e;">
     <div style="text-align:center;color:white;font-family:serif;font-weight:900;font-size:54px;">神さん、今日どない？</div>
     <div style="margin:70px 0 6px;text-align:center;color:#78131a;font-family:serif;font-weight:900;font-size:55px;">${esc(current.rank)}</div>
     <div style="text-align:center;color:#6b5845;font-size:25px;margin-bottom:28px;">${esc(current.name?current.name+"さん　":"")}${esc(date)}</div>
     <div style="background:rgba(255,255,255,.84);border:2px solid #d7a52f;border-radius:28px;padding:24px 34px;">
       ${rows}
       <div style="margin-top:24px;padding:24px;background:#f1dfb9;border-radius:20px;font-family:serif;font-size:29px;font-weight:800;line-height:1.65;">⛩️ 神の捨て台詞<br/>「${esc(current.oracle)}」</div>
       <div style="margin-top:16px;padding:20px;background:white;border:2px solid #e9c85d;border-radius:18px;font-size:26px;font-weight:800;line-height:1.6;">うめこ「${esc(current.umeko)}」</div>
     </div>
     <div style="text-align:center;color:#806d55;font-size:18px;margin-top:28px;">聞いたことを後悔するおみくじ</div>
   </div>`;

   const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500">
     <foreignObject width="1000" height="1500">${card}</foreignObject>
   </svg>`;

   const blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"});
   const url=URL.createObjectURL(blob);
   const image=new Image();

   image.onload=()=>{
     try{
       const c=document.createElement("canvas");
       c.width=1000;c.height=1500;
       const ctx=c.getContext("2d");
       ctx.fillStyle="#fffaf0";ctx.fillRect(0,0,c.width,c.height);
       ctx.drawImage(image,0,0);
       URL.revokeObjectURL(url);
       const png=c.toDataURL("image/png");
       $("savedImage").src=png;
       $("saveModal").classList.remove("hidden");
     }catch(err){
       console.error(err);
       URL.revokeObjectURL(url);
       alert("画像化でコケたわ😭");
     }
   };
   image.onerror=()=>{
     URL.revokeObjectURL(url);
     alert("保存画像を作れやんかった😭");
   };
   image.src=url;
 }catch(err){
   console.error(err);
   alert("保存処理でコケたわ😭");
 }
}
function closeSave(e){
 if(e && e.target!==$("saveModal")) return;
 $("saveModal").classList.add("hidden");
}
async function shareResult(){
 const text=`⛩️ 神さん、今日どない？\n【${current.rank}】\n神「${current.oracle}」\nうめこ「${current.umeko}」`;
 if(navigator.share){try{await navigator.share({title:"神さん、今日どない？",text,url:location.href})}catch(e){}}else{await navigator.clipboard.writeText(text+"\n"+location.href);alert("結果をコピーしたで。友だちに食らわせてきて🤣")}
}
